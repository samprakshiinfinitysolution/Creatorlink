<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0F14" />
      <stop offset="100%" stop-color="#1E1325" />
    </linearGradient>
    <linearGradient id="cl-grad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4F87" />
      <stop offset="60%" stop-color="#FF6B9D" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cl-sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF75A0" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="cl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="48" height="48" rx="13" fill="url(#cl-bg)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="url(#cl-grad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Monogram "C" & Link Motif -->
  <path d="M 28 15 C 24 13.5 17 14.5 14 18.5 C 10.5 23 11 30 15.5 33.5 C 19.5 36.5 26.5 35 29 32"
        stroke="url(#cl-grad)"
        stroke-width="4.2"
        stroke-linecap="round" />

  <!-- Link Bridge -->
  <path d="M 23 20 L 33 30"
        stroke="#FFFFFF"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-opacity="0.9" />
  <circle cx="23" cy="20" r="2.2" fill="#FF4F87" />
  <circle cx="33" cy="30" r="2.2" fill="#A855F7" />

  <!-- Signature Sparkle ✦ -->
  <path d="M 37 6 C 37 9.5 39 11.5 42.5 11.5 C 39 11.5 37 13.5 37 17 C 37 13.5 35 11.5 31.5 11.5 C 35 11.5 37 9.5 37 6 Z"
        fill="url(#cl-sparkle)"
        filter="url(#cl-glow)" />
</svg>
